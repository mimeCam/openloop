<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLoop Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas:      #0f1117;
            --bg-card:        #16181f;
            --bg-card-hover:  #1b1e27;
            --border-card:    rgba(255,255,255,0.08);
            --accent-green:   #34c759;
            --accent-red:     #ff453a;
            --accent-blue:    #0a84ff;
            --text-primary:   #f0f0f5;
            --text-muted:     #8e8ea0;
            --text-faint:     #4a4a5a;
            --chrome-bg:      rgba(15,17,23,0.92);
            --toolbar-height: 48px;
            --column-max:     720px;
            /* search-hit amber — the page's only warm hue, reserved for match highlighting */
            --search-hl-wash: rgba(255, 178, 36, 0.18);
            --search-hl-text: #ffd60a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: var(--bg-canvas);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 14px;
        }
        .toolbar {
            position: fixed; inset: 0 0 auto 0; height: var(--toolbar-height);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            background: var(--chrome-bg); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-card);
            z-index: 10;
        }
        .toolbar-title {
            display: flex; align-items: center; gap: 10px;
            font-weight: 600; font-size: 15px;
        }
        .toolbar-scope {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400; font-size: 14px; color: var(--text-muted);
        }
        .unread-pill {
            min-width: 20px; height: 20px; padding: 0 6px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: var(--accent-blue);
            color: #fff; font-size: 11px; font-weight: 600;
        }
        .unread-pill.zero { background: var(--bg-card-hover); color: var(--text-faint); }
        /* toolbar icon buttons — the 44px touch contract shared with panel.css */
        .mark-all-btn, .search-toggle {
            display: none;
            width: 44px; height: 44px;
            align-items: center; justify-content: center;
            border: 1px solid var(--border-card); border-radius: 8px;
            background: var(--bg-card); color: var(--text-muted); cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        .mark-all-btn.visible { display: inline-flex; }
        .mark-all-btn:hover, .search-toggle:hover { color: var(--text-primary); border-color: var(--accent-blue); }
        .mark-all-btn:focus-visible, .search-toggle:focus-visible {
            outline: 2px solid var(--accent-blue); outline-offset: 2px;
        }
        .search-toggle[aria-expanded="true"] {
            color: var(--accent-blue); border-color: rgba(10,132,255,0.28);
        }
        .clear-filter-btn {
            height: 32px; padding: 0 16px; margin-top: 16px;
            border: 1px solid rgba(10,132,255,0.40); border-radius: 8px;
            background: none; color: var(--accent-blue);
            font: inherit; font-size: 12px; cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .clear-filter-btn:hover { background: rgba(10,132,255,0.12); border-color: var(--accent-blue); }
        .clear-filter-btn:focus-visible {
            outline: 2px solid var(--accent-blue); outline-offset: 2px;
        }

        /* ── filter deck ── */
        .filter-bar {
            position: sticky; top: var(--toolbar-height); z-index: 9;
            display: flex; flex-direction: column; gap: 8px;
            max-width: var(--column-max); margin: calc(var(--toolbar-height) + 8px) auto 12px;
            padding: 12px 16px;
            background: var(--chrome-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-card); border-radius: 12px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 4px 16px rgba(0,0,0,0.30);
        }
        .filter-wrap { position: relative; display: flex; align-items: center; }
        #filter-input {
            flex: 1 1 auto; width: 100%; height: 36px;
            background: var(--bg-card);
            border: 1px solid var(--border-card); border-radius: 8px;
            color: var(--text-primary);
            font: inherit; font-size: 13px;
            padding: 0 30px 0 32px; outline: none;
            appearance: none; -webkit-appearance: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        /* WebKit paints its own ✕ on type=search — .filter-x already owns the job */
        #filter-input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
        #filter-input::placeholder { color: var(--text-muted); }
        #filter-input:hover { border-color: rgba(255,255,255,0.18); }
        #filter-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(10,132,255,0.25);
        }
        #filter-input:disabled { opacity: 0.5; }
        .filter-glyph { position: absolute; left: 9px; color: var(--text-faint); pointer-events: none; }
        .filter-wrap.armed .filter-glyph { color: var(--text-muted); }
        .filter-kbd {
            position: absolute; right: 8px;
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            color: var(--text-faint);
            border: 1px solid var(--border-card); border-radius: 4px;
            padding: 1px 5px; pointer-events: none;
        }
        .filter-wrap.armed .filter-kbd { display: none; }
        @media (hover: none) { .filter-kbd { display: none; } }
        /* clear ✕ — visible only when armed (fade 100ms, still Tab-reachable) */
        .filter-x {
            position: absolute; right: 6px;
            width: 20px; height: 20px; padding: 0;
            border: none; background: none; cursor: pointer;
            color: var(--text-muted); font-size: 13px; line-height: 20px;
            opacity: 0; visibility: hidden;
            transition: opacity 0.1s ease, visibility 0.1s;
        }
        .filter-wrap.armed .filter-x { opacity: 1; visibility: visible; }
        .filter-x:hover { color: var(--text-primary); }
        .filter-x:focus-visible {
            outline: 2px solid var(--accent-blue); outline-offset: 2px; border-radius: 4px;
        }

        /* Running-tasks badge — dark-theme twin of index.html's .running-badge
           (same counters, cap, pulse and pop; cyan shifted for this canvas). */
        .toolbar-side {
            display: flex; align-items: center; gap: 10px;
        }
        .running-badge {
            display: inline-flex; align-items: center; gap: 6px;
            border: 1px solid var(--border-card); border-radius: 8px;
            padding: 5px 9px; color: var(--text-muted);
            cursor: default;
        }
        .running-badge svg { display: block; }
        .running-count {
            font-size: 11px; font-family: 'JetBrains Mono', monospace;
            color: var(--text-faint); min-width: 12px; text-align: center;
        }
        .running-badge.is-running {
            background: rgba(34, 211, 238, 0.08);
            border-color: rgba(34, 211, 238, 0.35);
            color: #67e8f9;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.12);
            animation: running-pulse 2.5s ease-in-out infinite;
        }
        .running-badge.is-running .running-count { color: #67e8f9; font-weight: 600; }
        @keyframes running-pulse {
            0%, 100% { border-color: rgba(34, 211, 238, 0.25); }
            50% { border-color: rgba(34, 211, 238, 0.55); }
        }
        @keyframes badge-pop-anim {
            0% { transform: scale(1); }
            40% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        .running-badge.badge-pop { animation: badge-pop-anim 0.35s ease; }
        .running-badge.is-running.badge-pop {
            animation: badge-pop-anim 0.35s ease, running-pulse 2.5s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .running-badge.badge-pop { animation: none; }
            .running-badge.is-running { animation: none; border-color: rgba(34, 211, 238, 0.35); }
        }

        .list {
            max-width: var(--column-max); margin: 0 auto;
            padding: 0 16px 40px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .empty {
            text-align: center; color: var(--text-muted);
            padding: 80px 0; font-size: 13px;
        }
        .empty-icon { color: var(--text-faint); margin-bottom: 12px; }
        .empty-title { font-size: 14px; color: var(--text-primary); }
        .empty-hint {
            font-size: 12px; line-height: 1.5; margin-top: 4px;
            max-width: 340px; margin-left: auto; margin-right: auto;
        }
        /* color + wash only — zero metric change so wrapped lines never twitch */
        mark.hl {
            background: var(--search-hl-wash);
            color: var(--search-hl-text);
            border-radius: 3px; padding: 0 2px;
            -webkit-box-decoration-break: clone; box-decoration-break: clone;
        }
        .filter-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; color: var(--text-muted);
            text-align: right; padding: 0 2px;
        }
        .filter-status .filter-clear {
            border: none; background: none; padding: 0; cursor: pointer;
            font: inherit; color: var(--text-muted);
        }
        .filter-status .filter-clear:hover { color: var(--text-primary); text-decoration: underline; }
        .filter-status .filter-clear:focus-visible {
            outline: 2px solid var(--accent-blue); outline-offset: 2px; border-radius: 4px;
        }
        .list.fade-in { animation: list-breathe 0.15s ease; }
        @keyframes list-breathe { from { opacity: 0; } to { opacity: 1; } }
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        .error-banner {
            text-align: center; color: var(--accent-red);
            padding: 40px 0; font-size: 13px;
        }
        .notif {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-left: 3px solid transparent;
            border-radius: 12px;
        }
        .notif.unread {
            border-left-color: var(--accent-blue);
            background: linear-gradient(90deg, rgba(10,132,255,0.07), var(--bg-card) 40%);
        }
        .notif-icon {
            width: 28px; height: 28px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 14px;
            background: var(--bg-card-hover);
        }
        .notif-icon.ok { color: var(--accent-green); }
        .notif-icon.fail { color: var(--accent-red); }
        .notif-body { flex: 1; min-width: 0; }
        .notif-head {
            display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
            row-gap: 2px;
        }
        .notif-path {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500; font-size: 15px; color: var(--text-primary);
        }
        .notif-sep { color: var(--text-faint); font-weight: 400; }
        .notif-title { font-weight: 600; font-size: 15px; }
        .notif-title a { color: var(--text-primary); text-decoration: none; }
        .notif-title a:hover { color: var(--accent-blue); text-decoration: underline; }
        .notif-kind { color: var(--text-muted); }
        .notif-status { font-weight: 500; }
        .notif-status.ok { color: var(--accent-green); }
        .notif-status.fail { color: var(--accent-red); }
        .notif-meta {
            display: flex; flex-wrap: wrap; gap: 10px; margin-top: 3px;
            font-size: 11px; color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .notif-meta > * + *::before {
            content: '·';
            color: var(--text-faint);
            margin-right: 10px;
        }
        /* user's ask — wraps up to 3 lines, honoring their line breaks; over-
           threshold asks clamp with a soft fade + "show more" (grammar cloned
           from graph.html's .wl-bubble-text.truncated / .wl-expand-btn) */
        .notif-prompt {
            margin-top: 6px;
            font-size: 12px; line-height: 1.5; color: var(--text-muted);
            white-space: pre-wrap; word-break: break-word;
        }
        .notif-prompt.truncated {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
        }
        .notif-prompt.expanded {
            -webkit-line-clamp: unset;
            -webkit-mask-image: none;
            mask-image: none;
        }
        .notif-more {
            display: inline-block;
            margin-top: 6px;
            border: none; background: none; padding: 0;
            font: inherit; font-size: 11px;
            color: var(--text-muted); cursor: pointer;
        }
        .notif-more:hover { color: var(--text-primary); text-decoration: underline; }
        .notif-more:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px; border-radius: 4px;
        }
        .notif-open {
            flex-shrink: 0; align-self: center;
            font-size: 11px; color: var(--text-muted); text-decoration: none;
            border: 1px solid var(--border-card); border-radius: 6px;
            padding: 4px 8px;
        }
        .notif-open:hover { color: var(--accent-blue); border-color: var(--accent-blue); }
        .mark-read-btn {
            flex-shrink: 0; align-self: center;
            border: none; background: none; cursor: pointer;
            color: var(--text-faint); font-size: 11px; font-family: inherit;
            padding: 4px 6px;
        }
        .notif.unread .mark-read-btn { color: var(--accent-blue); }
        .mark-read-btn:hover { text-decoration: underline; }

        /* ── mobile: search demoted to a summoned sheet — 44px targets, same contract as panel.css ── */
        @media (max-width: 768px) {
            .toolbar { padding: 0 16px; }
            .search-toggle { display: inline-flex; }
            .filter-bar {
                position: fixed; inset: var(--toolbar-height) 0 auto 0;
                max-width: none; margin: 0;
                border-radius: 0 0 12px 12px;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 12px 32px -8px rgba(0,0,0,0.55);
                opacity: 0; visibility: hidden; transform: translateY(-6px); pointer-events: none;
                transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
            }
            body.search-open .filter-bar {
                opacity: 1; visibility: visible; transform: none; pointer-events: auto;
            }
            .list { padding: calc(var(--toolbar-height) + 16px) 16px 40px; }
            #filter-input {
                height: 44px; font-size: 16px; /* iOS zooms below 16px */
                padding: 0 40px 0 38px;
            }
            .filter-glyph { left: 12px; }
            .filter-kbd { display: none; }
            .filter-x { right: 0; width: 44px; height: 44px; font-size: 15px; line-height: 44px; }
            .notif-more {
                display: inline-flex; align-items: center;
                min-height: 44px; padding: 12px 0;
            }
            .notif-open, .mark-read-btn {
                display: inline-flex; align-items: center;
                min-height: 44px; padding-top: 10px; padding-bottom: 10px;
            }
            .notif-title a {
                display: -webkit-box; -webkit-line-clamp: 2;
                -webkit-box-orient: vertical; overflow: hidden;
            }
        }
        /* toolbar priority ladder as width shrinks — title + pill + actions always survive */
        @media (max-width: 480px) { .toolbar-scope { display: none; } }
        @media (max-width: 360px) { .running-badge { display: none; } }
        @media (prefers-reduced-motion: reduce) {
            .filter-bar { transition: none; }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-title">
            Notifications<span id="toolbar-scope" class="toolbar-scope"></span>
            <span id="unread-pill" class="unread-pill zero">0</span>
        </div>
        <div class="toolbar-side">
            <span
                id="running-badge"
                class="running-badge"
                role="status"
                aria-label="Running tasks"
                title="Running tasks"
            >
                <svg
                    viewBox="0 0 24 24"
                    width="14"
                    height="14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                </svg>
                <span id="running-count" class="running-count" aria-live="polite">0</span>
            </span>
            <button id="mark-all" class="mark-all-btn" type="button"
                aria-label="Mark all as read" title="Mark all as read">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 6 7 17l-5-5" />
                    <path d="m22 10-7.5 7.5L13 16" />
                </svg>
            </button>
            <button id="search-toggle" class="search-toggle" type="button"
                aria-label="Search notifications" aria-expanded="false" aria-controls="filter-bar">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
            </button>
        </div>
    </header>
    <!-- TODO: facet chips (Unread / Failed / kind) row between input and status -->
    <div id="filter-bar" class="filter-bar">
        <div class="filter-wrap">
            <svg class="filter-glyph" viewBox="0 0 24 24" width="14" height="14"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
            </svg>
            <input
                id="filter-input"
                type="search"
                placeholder="Filter by workflow, path or ask…"
                aria-label="Filter notifications"
                autocomplete="off"
                spellcheck="false"
            >
            <span class="filter-kbd" aria-hidden="true">/</span>
            <button id="filter-x" class="filter-x" type="button" aria-label="Clear filter">✕</button>
        </div>
        <div id="filter-status" class="filter-status" hidden></div>
    </div>
    <!-- SR announcements live outside #list — it is innerHTML-wiped every render -->
    <span id="filter-live" class="sr-only" role="status" aria-live="polite"></span>
    <main id="list" class="list">
        <div class="empty">Loading…</div>
    </main>
    <script src="/notifications.js"></script>
</body>
</html>
