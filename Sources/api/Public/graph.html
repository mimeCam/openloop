<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLoop Graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="panel.css">
    <style>
        :root {
            --bg-canvas:      #0f1117;
            --bg-card:        #16181f;
            --bg-card-header: #1b1e27;
            --border-card:    rgba(255,255,255,0.08);
            --accent-green:   #34c759;
            --accent-amber:   #f59e0b;
            --accent-red:     #ff453a;
            --accent-red-deep: #d70015;  /* armed delete fill — white text passes 4.5:1 */
            --accent-red-soft: #ff6961;  /* danger label + count badge text */
            --accent-blue:    #0a84ff;
            --text-primary:   #f0f0f5;
            --text-muted:     #8e8ea0;
            --text-faint:     #4a4a5a;
            --toolbar-height: 48px;
            --chain-height:   34px;
            --content-top:    calc(var(--toolbar-height) + var(--chain-height));
            --panel-top:      var(--content-top); /* consumed by panel.css */
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-canvas);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 0;
        }

        #graph-toolbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--toolbar-height);
            background: #16181f;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            z-index: 200;
            box-sizing: border-box;
        }

        .gt-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .gt-title-group {
            display: flex; flex-direction: column; gap: 0;
            line-height: 1.4; flex-shrink: 0;
        }
        .gt-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .gt-subtitle { font-size: 10px; color: var(--text-muted); text-decoration: none; }
        .gt-subtitle:hover { color: var(--accent-green); }
        .gt-version { font-size: 11px; color: var(--text-faint); }

        #graph-chain {
            position: fixed;
            top: var(--toolbar-height); left: 0; right: 0;
            height: var(--chain-height);
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            padding: 0 16px;
            background: #13151c;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 190;
            box-sizing: border-box;
        }
        .crumb {
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            min-width: 0;
        }
        .crumb.cur {
            color: var(--accent-green);
            font-weight: 600;
            flex-shrink: 0;
        }
        .crumb-sep {
            color: var(--text-faint);
            font-size: 11px;
            flex-shrink: 0;
        }

        .gt-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .countdown {
            font-size: 12px;
            font-family: "SF Mono", ui-monospace, monospace;
            color: var(--text-muted);
            min-width: 28px;
            text-align: right;
        }
        .countdown.warning { color: var(--accent-amber); }
        .countdown.paused { opacity: 0.5; }

        .lang-switcher { display: flex; gap: 4px; }
        .lang-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .lang-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .lang-btn.active { background: rgba(52,199,89,0.12); border-color: rgba(52,199,89,0.30); }

        /* Canvas right-edge transition + .panel-open live in panel.css */
        #graph-canvas {
            position: fixed;
            top: var(--content-top); left: 0; right: 0; bottom: 0;
            overflow: auto;
            background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        #graph-canvas::-webkit-scrollbar { width: 4px; height: 4px; }
        #graph-canvas::-webkit-scrollbar-track { background: var(--bg-canvas); }
        #graph-canvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 2px; }

        #graph-grid {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 56px;
            min-height: 100%;
            width: max-content;
            min-width: 100%;
            box-sizing: border-box;
            padding: 76px 48px 32px; /* clears the pinned #add-root at scroll origin */
            position: relative;
        }

        #edge-layer {
            position: absolute; top: 0; left: 0;
            pointer-events: none; overflow: visible;
            z-index: 0;
        }
        .edge {
            fill: none;
            stroke: rgba(255,255,255,0.16);
            stroke-width: 1.5;
        }
        .edge.to-progress { stroke: rgba(245,158,11,0.45); }

        .depth-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        /* pinned chrome, not grid content: fixed top-left, so it survives the
           scroll and the 5s renderGrid() innerHTML rewrite (the element itself
           lives in the static body next to #birds-eye-float — a left control
           rail). Dashed ring = the .be-trail grammar: "a slot not yet filled".
           Solid canvas fill + float shadow: cards scroll beneath it. */
        #add-root {
            position: fixed;
            top: calc(var(--content-top) + 12px);
            left: 16px;
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 1.5px dashed rgba(255,255,255,0.22);
            background: var(--bg-canvas);
            color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.45);
            transition: all 0.15s ease;
            z-index: 300;
            padding: 0;
        }
        #add-root:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: rgba(52,199,89,0.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(52,199,89,0.22);
        }
        #add-root:active { transform: scale(0.94); }
        #add-root:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; }
        /* empty-graph attract: the beacon keyframe grammar adapted to the
           button — 2 beats, once per empty period (syncAddRootAttract, graph.js) */
        #add-root.attract { animation: attract 1.2s ease-out 2; }
        @keyframes attract {
            0%   { box-shadow: 0 4px 16px rgba(0,0,0,0.45), 0 0 0 0 rgba(52,199,89,0.40); }
            100% { box-shadow: 0 4px 16px rgba(0,0,0,0.45), 0 0 0 14px rgba(52,199,89,0); }
        }

        #empty-hint {
            color: var(--text-muted); /* guidance, not fine print: must clear 4.5:1 */
            font-size: 13px;
            z-index: 1;
        }

        .node-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.40);
            width: 240px;
            box-sizing: border-box;
            cursor: pointer;
            overflow: hidden;
            transition: box-shadow 0.15s ease;
            display: flex;
            align-items: stretch;
        }
        .node-main { flex: 1; min-width: 0; }
        .node-card:hover { box-shadow: 0 4px 24px rgba(52,199,89,0.18), 0 0 0 1px rgba(52,199,89,0.22); }

        .node-card[data-status="progress"] { box-shadow: 0 0 0 1.5px rgba(245,158,11,0.55), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card[data-status="summarizing"] { box-shadow: 0 0 0 1.5px rgba(10,132,255,0.65), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card[data-status="answered"] { box-shadow: 0 0 0 1.5px rgba(255,159,10,0.55), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card[data-status="success"]  { box-shadow: 0 0 0 1.5px rgba(52,199,89,0.55), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card[data-status="failed"]   { box-shadow: 0 0 0 1.5px rgba(255,69,58,0.55), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card.selected { box-shadow: 0 0 0 2px var(--accent-green), 0 4px 24px rgba(52,199,89,0.25); }
        .node-cell.inactive { filter: grayscale(1); opacity: 0.55; }
        .node-cell.inactive .node-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.40); }
        .node-cell.inactive .node-card.selected { box-shadow: 0 0 0 2px rgba(255,255,255,0.30), 0 4px 24px rgba(0,0,0,0.45); }

        .node-cell { position: relative; }
        .node-slot { position: relative; }

        .node-run-btn {
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 5px 0 4px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        .node-run-btn:hover { background: rgba(52,199,89,0.10); border-color: rgba(52,199,89,0.30); }
        .node-run-btn:disabled { opacity: 0.35; cursor: default; }
        .node-run-btn:disabled:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.10); }
        .run-counts {
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 9px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;  /* counts line never wraps — no reflow when runs start/finish */
        }
        .run-counts .ok { color: var(--accent-green); }
        .run-counts .bad { color: var(--accent-red); }
        /* "· Running: N" token — amber already means "running" on this page
           (status dot, card ring, incoming edge). Opacity-only breathe: 9px mono
           text must not scale-wobble, floor 0.65 keeps it readable mid-breath;
           2.5s tempo matches the instances page's secondary-live pulse. */
        .run-counts .live {
            color: var(--accent-amber);
            animation: live-breathe 2.5s ease-in-out infinite;
        }

        .node-insert-btn {
            position: absolute;
            left: -13px; top: 50%;
            transform: translateY(-50%);
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 2px solid var(--bg-canvas);
            background: #ff9f0a;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0;
            z-index: 2;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .node-insert-btn:hover { background: #ffb340; transform: translateY(-50%) scale(1.12); }

        .node-personas {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            padding: 0 2px;
            flex-wrap: wrap;
        }
        .pp-avatar {
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .np-avatar { width: 20px; height: 20px; }
        .pp-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 600;
        }
        .persona-group { margin-bottom: 12px; }
        .persona-group:last-child { margin-bottom: 0; }
        .persona-group-label {
            font-size: 9px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .persona-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .persona-pick {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 62px;
            cursor: pointer;
        }
        .persona-pick .pp-avatar {
            width: 34px;
            height: 34px;
            border: 2px solid transparent;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .persona-pick .pp-fallback { font-size: 12px; }
        .persona-pick:hover .pp-avatar { border-color: rgba(255,255,255,0.35); }
        .persona-pick.selected .pp-avatar {
            border: 3px solid var(--accent-green);
            box-shadow: 0 0 0 2px rgba(52,199,89,0.25);
        }
        .persona-pick-name {
            font-size: 10px;
            color: var(--text-muted);
            max-width: 62px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: break-word;
            line-height: 1.3;
            text-align: center;
        }
        .persona-pick.selected .persona-pick-name {
            color: var(--accent-green);
            font-weight: 600;
        }

        .node-card-header {
            background: var(--bg-card-header);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            box-sizing: border-box;
        }
        .node-card-body {
            padding: 10px 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .node-dur {
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 11px;
            color: var(--text-muted);
            flex: 1;
            min-width: 0;
            white-space: nowrap;
        }
        .node-dur:empty { display: none; }

        /* cell title: ink on the canvas ABOVE the card, never inside it (a
           card is 240px of machine facts; a name is a human word that wraps).
           Card-bounded — exactly the card's 240px column track, left-aligned:
           a title confined to its column cannot collide with a neighbour's,
           safe by construction (no negative-margin geometry to maintain), and
           the leftmost title sits flush with its card at scroll origin. One
           alignment: title text → card border → bubble text. Clamped at 10
           lines; the tooltip carries the full text. No chrome — no
           bg/border/shadow; the 6px gap parents it. */
        .node-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: left;
            line-height: 1.4;
            word-break: break-word;
            margin: 0 0 6px;
            max-width: 240px;
        }
        /* selected cell: green ink — the page's "selected = green" grammar,
           now naturally true for every named cell
           (:has() progressive enhancement: no support, no loss) */
        .node-cell:has(.node-card.selected) .node-title { color: var(--accent-green); }

        .mcp-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ff9f0a;
            background: rgba(255,159,10,0.12);
            border: 1px solid rgba(255,159,10,0.30);
            border-radius: 4px;
            padding: 1px 5px;
            flex-shrink: 0;
        }

        .mcp-row { display: flex; gap: 8px; }
        .mcp-row input {
            flex: 1;
            min-width: 0;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 12px;
            padding: 8px 10px;
        }
        .mcp-row input:focus { outline: none; border-color: rgba(255,159,10,0.55); }
        .mcp-row button {
            background: rgba(255,159,10,0.14);
            border: 1px solid rgba(255,159,10,0.35);
            border-radius: 8px;
            color: #ffb340;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            padding: 0 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .mcp-row button:hover { background: rgba(255,159,10,0.24); }
        .mcp-row button.saved {
            background: rgba(52,199,89,0.14);
            border-color: rgba(52,199,89,0.40);
            color: #34c759;
        }
        .mcp-row button.saved:hover { background: rgba(52,199,89,0.20); }
        .mcp-hint {
            font-size: 11px;
            color: var(--text-faint);
            margin-top: 6px;
        }

        /* NAME row: mcp-row geometry, neutral/green skin — amber is the mcp
           domain; the name is a human word, so Inter, not mono. A one-row
           textarea that grows (autosizeName, graph.js): names are usually
           descriptions, and comfort while authoring is the feature. The Save
           button stays pinned top as the field grows. */
        .name-row { display: flex; gap: 8px; align-items: flex-start; }
        .name-row textarea {
            flex: 1;
            min-width: 0;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
            line-height: 1.5;
            padding: 8px 10px;
            box-sizing: border-box;
            min-height: 37px;
            resize: none;
            overflow: hidden;
        }
        .name-row textarea:focus { outline: none; border-color: rgba(52,199,89,0.5); }
        .name-row button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            padding: 0 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .name-row button:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.25); }
        .name-row button.saved {
            background: rgba(52,199,89,0.14);
            border-color: rgba(52,199,89,0.40);
            color: #34c759;
        }
        .node-status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .node-status-dot.progress {
            background: var(--accent-amber);
            animation: pulse 1.2s ease-in-out infinite;
        }
        .node-status-dot.summarizing {
            background: var(--accent-blue);
            animation: pulse 1.2s ease-in-out infinite;
        }
        .node-status-dot.answered { background: #ff9f0a; }
        .node-status-dot.success { background: var(--accent-green); }
        .node-status-dot.failed { background: var(--accent-red); }
        /* bird's-eye caption tints — same status tokens as the dots above:
           the bubble's border/bg wear the cell's hue at whisper volume
           (badge grammar: fill ≤ 0.12, border ≤ 0.35) so the dot above the
           row and the bubble below it read as one colored object */
        .be-caption.progress    { background: rgba(245,158,11,0.10); border-color: rgba(245,158,11,0.26); }
        .be-caption.summarizing { background: rgba(10,132,255,0.10); border-color: rgba(10,132,255,0.26); }
        .be-caption.answered    { background: rgba(255,159,10,0.10); border-color: rgba(255,159,10,0.26); }
        .be-caption.success     { background: rgba(52,199,89,0.10); border-color: rgba(52,199,89,0.26); }
        .be-caption.failed      { background: rgba(255,69,58,0.12); border-color: rgba(255,69,58,0.32); }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.75); }
        }
        @keyframes live-breathe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.65; }
        }

        .node-add-child {
            width: 36px;
            border: none;
            background: var(--accent-green);
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            line-height: 1;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.15s ease;
        }
        .node-add-child:hover { filter: brightness(1.18); }
        .node-card[data-status="progress"] .node-add-child { background: var(--accent-amber); }
        .node-card[data-status="summarizing"] .node-add-child { background: var(--accent-blue); }
        .node-card[data-status="answered"] .node-add-child { background: #ff9f0a; }
        .node-card[data-status="failed"] .node-add-child { background: var(--accent-red); }
        .node-card[data-status="success"] .node-add-child { background: var(--accent-green); }

        /* Bubble skeleton (layout, truncation, copy button, mobile touch
           targets) lives in panel.css; this page's color variants below. */
        .wl-bubble.input {
            background: rgba(10,132,255,0.10);
            border: 1px solid rgba(10,132,255,0.22);
        }
        .wl-bubble.input .wl-bubble-label { color: #0a84ff; }
        .wl-bubble.output {
            background: rgba(52,199,89,0.10);
            border: 1px solid rgba(52,199,89,0.22);
        }
        .wl-bubble.output .wl-bubble-label { color: #34c759; }
        .wl-bubble.output.error {
            background: rgba(255,69,58,0.12);
            border: 1px solid rgba(255,69,58,0.30);
        }
        .wl-bubble.output.error .wl-bubble-label { color: #ff453a; }
        .wl-bubble.summary {
            background: rgba(52,199,89,0.07);
            border: 1px solid rgba(52,199,89,0.18);
        }

        /* page-specific: cards clamp tighter than the panel's default 8 lines */
        .node-card .wl-bubble-text.truncated { -webkit-line-clamp: 3; }
        .node-card .wl-bubble-text.result-snippet {
            -webkit-line-clamp: 5;
            font-size: 11px;
            color: var(--text-muted);
        }
        .node-card .wl-bubble-text.summary-text {
            -webkit-line-clamp: 5;
            font-size: 11px;
            color: var(--text-muted);
        }

        #composer {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(480px, calc(100vw - 32px));
            background: #16181f;
            border: 1px solid rgba(255,255,255,0.08);

        /* — birds-eye view: one lane per chain, dots on a line, personas after — */

        body.birds-eye #graph-grid { display: none; }
        #birds-eye {
            display: none;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
            min-height: 100%;
            width: max-content;
            min-width: 100%;
            box-sizing: border-box;
            padding: 76px 24px 96px 48px; /* same top clearance as the grid */
        }
        body.birds-eye #birds-eye {
            display: flex;
            animation: be-enter 0.30s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes be-enter {
            from { opacity: 0; transform: translateY(10px) scale(1.02); }
        }
        #birds-eye #empty-hint { align-self: center; }

        .be-chain {
            display: flex;
            flex-direction: column;
        }

        /* — caption cascade: the chain explains itself under its rail —
           One row per named cell, stacked in chain order (block flow: two
           rows can never overlap), each spanning the full remaining width.
           Row i's left edge pins to its cell's dot left edge — slot 48px,
           dot 16px wide, center x=24 → left edge x=16 (mobile: 40/12) — the
           dot sits atop the bubble's left corner like a timeline marker
           pinning its own note. The indent caps (--cap) so deep chains keep
           ≥ half the row for text. Skin: the cell's status hue at whisper
           volume (.wl-bubble tint grammar) — dot, border and fill agree;
           text stays --text-primary (≈14:1 on the tinted canvas). Tap = its
           dot's tap (focusFromBirds). clamp-10 + tooltip carry the worst
           case; unnamed chains render no cascade at all. */
        .be-captions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
            /* width:0 keeps the block OUT of the chain's intrinsic width —
               #birds-eye is width:max-content, so an unbroken 300-char word
               in a row would otherwise balloon the whole host past the
               viewport (the old 480px strip cap prevented it); min-width:100%
               stretches the block back to the full chain width at layout.
               Lanes size the chain; captions only read it. */
            width: 0;
            min-width: 100%;
            box-sizing: border-box;
        }
        .be-caption {
            --slot: 48px;     /* one rail slot of indent per chain step */
            --dot-left: 16px; /* dot left edge inside its slot */
            --cap: 192px;     /* indent ceiling — deep cells keep readable width */
            margin-left: min(calc(var(--slot) * var(--i, 0) + var(--dot-left)), var(--cap));
            border-radius: 8px;
            padding: 4px 10px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.45;
            text-align: left;
            color: var(--text-primary);
            word-break: break-word;
            overflow-wrap: anywhere; /* long tokens break at any width, not just line edges */
            cursor: pointer;
            background: rgba(255,255,255,0.04);  /* neutral fallback tint */
            border: 1px solid rgba(255,255,255,0.10);
            transition: border-color 0.15s ease;
        }
        .be-caption:hover { filter: brightness(1.4); }
        .be-caption:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; }
        .be-caption.inactive { opacity: 0.55; }

        .be-lane {
            display: flex;
            height: 72px;
            width: max-content;
        }
        .be-slot { position: relative; width: 48px; flex-shrink: 0; }
        .be-slot::after {
            content: '';
            position: absolute;
            top: 23px; left: 32px;
            width: 32px; height: 2px;
            border-radius: 1px;
            background: rgba(255,255,255,0.16);
        }
        .be-slot.to-progress::after { background: rgba(245,158,11,0.45); }
        .be-slot.inactive::after { background: rgba(255,255,255,0.08); }
        .be-slot.last::after { display: none; }

        .be-dot {
            position: absolute;
            left: calc(50% - 8px);
            top: 16px;
            width: 16px; height: 16px;
            border: none;
            padding: 0;
            cursor: pointer;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
            transition: box-shadow 0.15s ease, transform 0.1s ease;
        }
        .be-dot::before { content: ''; position: absolute; inset: -12px; }
        .be-dot:hover { box-shadow: 0 0 0 3px rgba(52,199,89,0.25); }
        .be-dot:active { transform: scale(0.9); }
        .be-dot:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 4px; }
        .be-slot.inactive .be-dot { filter: grayscale(1); opacity: 0.55; }

        .be-mini {
            position: absolute;
            top: 32px; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
        }
        .be-mi-avatar { width: 14px; height: 14px; }
        .be-mi-avatar.pp-fallback { font-size: 8px; }
        .be-slot.inactive .be-mini { opacity: 0.55; }

        .be-trail {
            position: relative;
            display: flex;
            gap: 10px;
            padding-top: 14px;
            flex-shrink: 0;
        }
        .be-trail::before {
            content: '';
            position: absolute;
            top: 23px; left: -8px; right: 5px;
            border-top: 1.5px dashed rgba(255,255,255,0.10);
        }
        .be-persona {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .be-p-avatar { width: 20px; height: 20px; }
        .be-persona-name {
            font-size: 10px;
            color: var(--text-muted);
            max-width: 62px;
            text-align: center;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: break-word;
        }
        .be-more {
            position: relative;
            z-index: 1;
            width: 20px; height: 20px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.08);
            color: var(--text-muted);
            font-size: 9px;
            font-family: inherit;
            cursor: pointer;
            padding: 0;
        }
        .be-more:hover { color: var(--text-primary); }

        .be-whisper {
            position: fixed;
            left: 76px; bottom: 31px;
            font-size: 11px;
            color: var(--text-muted);
            z-index: 300;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .node-card.beacon { animation: beacon 0.9s ease-out 1; }
        @keyframes beacon {
            0% { box-shadow: 0 0 0 0 rgba(52,199,89,0.45), 0 4px 24px rgba(52,199,89,0.25); }
            100% { box-shadow: 0 0 0 14px rgba(52,199,89,0), 0 4px 24px rgba(52,199,89,0.25); }
        }

        @media (max-width: 768px) {
            .be-slot { width: 40px; }
            .be-slot::after { left: 28px; width: 24px; }
            .be-dot::before { inset: -16px; }
            /* 40px slot → dot left edge at x=12; tighter cap keeps ≥ half a
               phone width for text (tooltip + panel carry the full name) */
            .be-caption { --slot: 40px; --dot-left: 12px; --cap: 160px; }
        }
        @media (prefers-reduced-motion: reduce) {
            body.birds-eye #birds-eye { animation: none; }
            .node-card.beacon { animation: none; }
            #add-root.attract { animation: none; }
            .be-dot, .be-toggle, .be-caption, #add-root { transition: none; }
        }

        @media (max-width: 768px) {
            .gt-subtitle, .gt-version { display: none; }
            /* 16px inputs: iOS Safari skips its focus auto-zoom at >=16px
               (panel sheet pose itself lives in panel.css) */
            #prompt-section textarea, #summary-section textarea, .run-summary-section textarea, .run-composer textarea, .mcp-row input, .name-row textarea { font-size: 16px; }
            .run-back-btn { width: 44px; height: 44px; }

            /* under-log arrow owns its row: full 44px, no cost */
            .run-log-focus-row .run-focus-btn { width: 44px; height: 44px; }
            /* header arrow shares the caption line: 32px visual, 44px hit via ::after */
            .run-log-meta .run-focus-btn { position: relative; }
            .run-log-meta .run-focus-btn::after { content: ''; position: absolute; inset: -6px; }
        }

        /* — delete actions: danger zone at the panel bottom, calm until armed — */
        .delete-section {

        .detail-section-label.danger { color: var(--accent-red-soft); }

        .delete-btn {
            width: 100%; box-sizing: border-box;
            display: flex; align-items: center; gap: 8px;
            min-height: 40px; padding: 8px 12px;
            background: rgba(255,69,58,0.10);
            border: 1px solid rgba(255,69,58,0.35);
            border-radius: 8px;
            color: var(--accent-red);

            transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
        }
        .delete-btn + .delete-btn { margin-top: 12px; } /* direct stacking */
        .delete-hint + .delete-btn { margin-top: 12px; } /* hint sits between the two buttons */
        .delete-btn:hover:not(:disabled):not(.armed) {
            background: rgba(255,69,58,0.18);
            border-color: rgba(255,69,58,0.50);
        }
        .delete-btn:focus-visible { outline: 2px solid var(--accent-red); outline-offset: 2px; }
        .delete-btn:disabled { opacity: 0.35; cursor: default; }

        .delete-count {
            margin-left: auto;
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 10px; font-weight: 500;
            color: var(--accent-red-soft);
            background: rgba(255,69,58,0.14);
            border: 1px solid rgba(255,69,58,0.25);
            border-radius: 4px; padding: 1px 6px;
        }

        .delete-btn.armed {
            background: var(--accent-red-deep);
            border-color: rgba(255,69,58,0.80);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255,69,58,0.35), 0 0 0 1px rgba(255,69,58,0.55);
        }
        .delete-btn.armed .delete-count { display: none; } /* magnitude restated in the label */
        .delete-btn.armed::after {              /* the 3s heartbeat */
            content: ''; position: absolute; left: 0; right: 0; bottom: 0;
            height: 2px; background: rgba(255,255,255,0.40);
            transform-origin: left;
            animation: delete-countdown 3s linear forwards;
        }
        @keyframes delete-countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
        .delete-btn.deleting { animation: pulse 1.2s ease-in-out infinite; }

        .delete-hint {
            font-size: 10.5px; line-height: 1.5;
            color: var(--text-muted);
            margin: 6px 2px 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .delete-btn.armed::after { animation: none; background: rgba(255,255,255,0.25); }
            .delete-btn.deleting { animation: none; }
            .run-counts .live { animation: none; }
            .detail-section-label.running { animation: none; }
            .detail-panel-body.run-enter { animation: none; }
            .detail-panel-body.run-back { animation: none; }
        }
    </style>
</head>
<body>

    <header id="graph-toolbar">
        <div class="gt-left">
            <div class="lang-switcher" role="group" aria-label="Language selection">
                <button class="lang-btn" data-lang="en" aria-label="Switch to English" aria-pressed="false">🇬🇧</button>
                <button class="lang-btn" data-lang="fr" aria-label="Passer au français" aria-pressed="false">🇫🇷</button>
            </div>
        </div>
        <div class="gt-title-group">
            <span class="gt-title">openloop graph</span>
            <span class="gt-version">version 1.0</span>
        </div>
        <div class="gt-right">
            <button id="birds-eye-toggle" class="be-toggle" aria-pressed="false" title="Bird's-eye view" aria-label="Bird's-eye view">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="8"/>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
                    <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                </svg>
            </button>
            <span id="refreshCountdown" class="countdown" title="Auto-refresh every 5s"></span>
        </div>
    </header>

    <div id="graph-chain"></div>

    <div id="graph-canvas">
        <div id="graph-grid"></div>
        <div id="birds-eye"></div>
    </div>

    <button id="birds-eye-float" class="be-toggle" aria-pressed="false" title="Bird's-eye view" aria-label="Bird's-eye view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="8"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
    </button>

    <!-- pinned top-left: static body-level DOM, outside the 5s renderGrid()
         rewrite; NOT a .be-toggle — it must stay enabled on an empty graph,
         where it is the start affordance. Bound once at module scope. -->
    <button id="add-root" title="New root run" aria-label="New root run">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
        </svg>
    </button>

    <div id="composer">
        <button id="composer-cancel" title="Cancel">✕</button>
        <textarea id="composer-text" placeholder="Type the prompt…" autocomplete="off" spellcheck="false"></textarea>
        <button id="composer-mcp-toggle" type="button">add mcp</button>
        <div id="composer-mcp">
            <div class="mcp-row">
                <input id="composer-mcp-url" type="text" placeholder="https://example.com/mcp" spellcheck="false" autocomplete="off">
            </div>
            <div class="mcp-row">
                <input id="composer-mcp-auth" type="text" placeholder="Authorization header value, e.g. Bearer sk-…" spellcheck="false" autocomplete="off">
            </div>
            <div class="mcp-hint">Remote MCP for the new cell (optional). Config file is generated automatically.</div>
        </div>
        <div id="composer-agents"></div>
        <div id="composer-hint">Pick an agent to run. Runs with the _bottom_ persona.</div>
    </div>

    <div id="detail-panel">
        <div class="panel-resize"></div>
        <div id="detail-panel-inner"></div>
    </div>

    <div id="error-banner"></div>

    <script src="lang.js"></script>
    <script src="panel.js"></script>
    <script src="graph.js"></script>
    <script>
        initLangSwitcher();
    </script>
</body>
</html>
