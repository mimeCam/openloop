<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLoop Graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas:      #0f1117;
            --bg-card:        #16181f;
            --bg-card-header: #1b1e27;
            --border-card:    rgba(255,255,255,0.08);
            --accent-green:   #34c759;
            --accent-amber:   #f59e0b;
            --accent-red:     #ff453a;
            --accent-blue:    #0a84ff;
            --text-primary:   #f0f0f5;
            --text-muted:     #8e8ea0;
            --text-faint:     #4a4a5a;
            --toolbar-height: 48px;
            --chain-height:   34px;
            --content-top:    calc(var(--toolbar-height) + var(--chain-height));
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-canvas);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 0;
        }

        #graph-toolbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--toolbar-height);
            background: #16181f;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            z-index: 200;
            box-sizing: border-box;
        }

        .gt-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .gt-title-group {
            display: flex; flex-direction: column; gap: 0;
            line-height: 1.4; flex-shrink: 0;
        }
        .gt-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .gt-subtitle { font-size: 10px; color: var(--text-muted); text-decoration: none; }
        .gt-subtitle:hover { color: var(--accent-green); }
        .gt-version { font-size: 11px; color: var(--text-faint); }

        #graph-chain {
            position: fixed;
            top: var(--toolbar-height); left: 0; right: 0;
            height: var(--chain-height);
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            padding: 0 16px;
            background: #13151c;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 190;
            box-sizing: border-box;
        }
        .crumb {
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            min-width: 0;
        }
        .crumb.cur {
            color: var(--accent-green);
            font-weight: 600;
            flex-shrink: 0;
        }
        .crumb-sep {
            color: var(--text-faint);
            font-size: 11px;
            flex-shrink: 0;
        }

        .gt-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .countdown {
            font-size: 12px;
            font-family: "SF Mono", ui-monospace, monospace;
            color: var(--text-muted);
            min-width: 28px;
            text-align: right;
        }
        .countdown.warning { color: var(--accent-amber); }
        .countdown.paused { opacity: 0.5; }

        .lang-switcher { display: flex; gap: 4px; }
        .lang-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .lang-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .lang-btn.active { background: rgba(52,199,89,0.12); border-color: rgba(52,199,89,0.30); }

        #graph-canvas {
            position: fixed;
            top: var(--content-top); left: 0; right: 0; bottom: 0;
            overflow: auto;
            background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 24px 24px;
            transition: right 0.30s cubic-bezier(0.4,0,0.2,1);
        }
        #graph-canvas.panel-open { right: 420px; }
        #graph-canvas::-webkit-scrollbar { width: 4px; height: 4px; }
        #graph-canvas::-webkit-scrollbar-track { background: var(--bg-canvas); }
        #graph-canvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 2px; }

        #graph-grid {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 56px;
            min-height: 100%;
            width: max-content;
            min-width: 100%;
            box-sizing: border-box;
            padding: 32px 48px;
            position: relative;
        }

        #edge-layer {
            position: absolute; top: 0; left: 0;
            pointer-events: none; overflow: visible;
            z-index: 0;
        }
        .edge {
            fill: none;
            stroke: rgba(255,255,255,0.16);
            stroke-width: 1.5;
        }
        .edge.to-progress { stroke: rgba(245,158,11,0.45); }

        .depth-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        #add-root {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s ease;
            z-index: 1;
        }
        #add-root:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: rgba(52,199,89,0.08);
        }

        #empty-hint {
            color: var(--text-faint);
            font-size: 13px;
            z-index: 1;
        }

        .node-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.40);
            width: 240px;
            box-sizing: border-box;
            cursor: pointer;
            overflow: hidden;
            transition: box-shadow 0.15s ease;
            display: flex;
            align-items: stretch;
        }
        .node-main { flex: 1; min-width: 0; }
        .node-card:hover { box-shadow: 0 4px 24px rgba(52,199,89,0.18), 0 0 0 1px rgba(52,199,89,0.22); }

        .node-card[data-status="progress"] { box-shadow: 0 0 0 1.5px rgba(245,158,11,0.55), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card[data-status="summarizing"] { box-shadow: 0 0 0 1.5px rgba(10,132,255,0.65), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card[data-status="answered"] { box-shadow: 0 0 0 1.5px rgba(255,159,10,0.55), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card[data-status="success"]  { box-shadow: 0 0 0 1.5px rgba(52,199,89,0.55), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card[data-status="failed"]   { box-shadow: 0 0 0 1.5px rgba(255,69,58,0.55), 0 2px 12px rgba(0,0,0,0.40); }
        .node-card.selected { box-shadow: 0 0 0 2px var(--accent-green), 0 4px 24px rgba(52,199,89,0.25); }
        .node-cell.inactive { filter: grayscale(1); opacity: 0.55; }
        .node-cell.inactive .node-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.40); }
        .node-cell.inactive .node-card.selected { box-shadow: 0 0 0 2px rgba(255,255,255,0.30), 0 4px 24px rgba(0,0,0,0.45); }

        .node-cell { position: relative; }
        .node-slot { position: relative; }

        .node-run-btn {
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 5px 0 4px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }
        .node-run-btn:hover { background: rgba(52,199,89,0.10); border-color: rgba(52,199,89,0.30); }
        .node-run-btn:disabled { opacity: 0.35; cursor: default; }
        .node-run-btn:disabled:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.10); }
        .run-counts {
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 9px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .run-counts .ok { color: var(--accent-green); }
        .run-counts .bad { color: var(--accent-red); }

        .node-insert-btn {
            position: absolute;
            left: -13px; top: 50%;
            transform: translateY(-50%);
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 2px solid var(--bg-canvas);
            background: #ff9f0a;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0;
            z-index: 2;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .node-insert-btn:hover { background: #ffb340; transform: translateY(-50%) scale(1.12); }

        .node-personas {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            padding: 0 2px;
            flex-wrap: wrap;
        }
        .pp-avatar {
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .np-avatar { width: 20px; height: 20px; }
        .pp-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 600;
        }
        .persona-group { margin-bottom: 12px; }
        .persona-group:last-child { margin-bottom: 0; }
        .persona-group-label {
            font-size: 9px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .persona-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .persona-pick {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 62px;
            cursor: pointer;
        }
        .persona-pick .pp-avatar {
            width: 34px;
            height: 34px;
            border: 2px solid transparent;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .persona-pick .pp-fallback { font-size: 12px; }
        .persona-pick:hover .pp-avatar { border-color: rgba(255,255,255,0.35); }
        .persona-pick.selected .pp-avatar {
            border: 3px solid var(--accent-green);
            box-shadow: 0 0 0 2px rgba(52,199,89,0.25);
        }
        .persona-pick-name {
            font-size: 10px;
            color: var(--text-muted);
            max-width: 62px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: break-word;
            line-height: 1.3;
            text-align: center;
        }
        .persona-pick.selected .persona-pick-name {
            color: var(--accent-green);
            font-weight: 600;
        }

        .node-card-header {
            background: var(--bg-card-header);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            box-sizing: border-box;
        }
        .node-card-body {
            padding: 10px 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .node-dur {
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 11px;
            color: var(--text-muted);
            flex: 1;
            min-width: 0;
            white-space: nowrap;
        }
        .node-dur:empty { display: none; }

        .mcp-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ff9f0a;
            background: rgba(255,159,10,0.12);
            border: 1px solid rgba(255,159,10,0.30);
            border-radius: 4px;
            padding: 1px 5px;
            flex-shrink: 0;
        }

        .mcp-row { display: flex; gap: 8px; }
        .mcp-row input {
            flex: 1;
            min-width: 0;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 12px;
            padding: 8px 10px;
        }
        .mcp-row input:focus { outline: none; border-color: rgba(255,159,10,0.55); }
        .mcp-row button {
            background: rgba(255,159,10,0.14);
            border: 1px solid rgba(255,159,10,0.35);
            border-radius: 8px;
            color: #ffb340;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            padding: 0 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .mcp-row button:hover { background: rgba(255,159,10,0.24); }
        .mcp-row button.saved {
            background: rgba(52,199,89,0.14);
            border-color: rgba(52,199,89,0.40);
            color: #34c759;
        }
        .mcp-row button.saved:hover { background: rgba(52,199,89,0.20); }
        .mcp-hint {
            font-size: 11px;
            color: var(--text-faint);
            margin-top: 6px;
        }
        .node-status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .node-status-dot.progress {
            background: var(--accent-amber);
            animation: pulse 1.2s ease-in-out infinite;
        }
        .node-status-dot.summarizing {
            background: var(--accent-blue);
            animation: pulse 1.2s ease-in-out infinite;
        }
        .node-status-dot.answered { background: #ff9f0a; }
        .node-status-dot.success { background: var(--accent-green); }
        .node-status-dot.failed { background: var(--accent-red); }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.75); }
        }

        .node-add-child {
            width: 36px;
            border: none;
            background: var(--accent-green);
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            line-height: 1;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.15s ease;
        }
        .node-add-child:hover { filter: brightness(1.18); }
        .node-card[data-status="progress"] .node-add-child { background: var(--accent-amber); }
        .node-card[data-status="summarizing"] .node-add-child { background: var(--accent-blue); }
        .node-card[data-status="answered"] .node-add-child { background: #ff9f0a; }
        .node-card[data-status="failed"] .node-add-child { background: var(--accent-red); }
        .node-card[data-status="success"] .node-add-child { background: var(--accent-green); }

        .wl-bubble {
            border-radius: 8px;
            padding: 10px 14px;
            position: relative;
        }
        .wl-bubble-label {
            font-size: 9px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.6px;
            display: block; margin-bottom: 6px;
            color: var(--text-muted);
        }
        .wl-bubble-text {
            font-size: 13px; line-height: 1.65;
            color: var(--text-primary);
            white-space: pre-wrap; word-break: break-word;
        }
        .wl-bubble.input {
            background: rgba(10,132,255,0.10);
            border: 1px solid rgba(10,132,255,0.22);
        }
        .wl-bubble.input .wl-bubble-label { color: #0a84ff; }
        .wl-bubble.output {
            background: rgba(52,199,89,0.10);
            border: 1px solid rgba(52,199,89,0.22);
        }
        .wl-bubble.output .wl-bubble-label { color: #34c759; }
        .wl-bubble.output.error {
            background: rgba(255,69,58,0.12);
            border: 1px solid rgba(255,69,58,0.30);
        }
        .wl-bubble.output.error .wl-bubble-label { color: #ff453a; }
        .wl-bubble.summary {
            background: rgba(52,199,89,0.07);
            border: 1px solid rgba(52,199,89,0.18);
        }

        .wl-bubble-text.truncated {
            display: -webkit-box;
            -webkit-line-clamp: 8;
            -webkit-box-orient: vertical;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
        }
        .wl-bubble-text.expanded {
            -webkit-line-clamp: unset;
            -webkit-mask-image: none;
            mask-image: none;
        }
        .node-card .wl-bubble-text.truncated { -webkit-line-clamp: 3; }
        .node-card .wl-bubble-text.result-snippet {
            -webkit-line-clamp: 5;
            font-size: 11px;
            color: var(--text-muted);
        }
        .node-card .wl-bubble-text.summary-text {
            -webkit-line-clamp: 5;
            font-size: 11px;
            color: var(--text-muted);
        }
        .wl-expand-btn {
            display: inline-block;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 8px;
            border: none;
            background: none;
            padding: 0;
            font-family: inherit;
        }
        .wl-expand-btn:hover { color: var(--text-primary); text-decoration: underline; }
        .wl-bubble-copy {
            position: absolute; top: 8px; right: 8px;
            display: none;
            width: 24px; height: 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px; cursor: pointer;
            color: var(--text-muted); font-size: 11px;
            align-items: center; justify-content: center;
            padding: 0;
        }
        .wl-bubble:hover .wl-bubble-copy { display: flex; }

        #composer {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(480px, calc(100vw - 32px));
            background: #16181f;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            box-shadow: 0 16px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(52,199,89,0.06);
            z-index: 500;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        #composer.open { display: flex; }
        #composer-text {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            line-height: 1.5;
            padding: 10px 12px;
            resize: vertical;
            min-height: 72px;
        }
        #composer-text:focus { outline: none; border-color: rgba(52,199,89,0.5); }
        #composer-agents {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .agent-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 11px;
            padding: 6px 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .agent-btn:hover:not(:disabled) {
            border-color: var(--accent-green);
            background: rgba(52,199,89,0.10);
        }
        .agent-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        #composer-hint { font-size: 11px; color: var(--text-faint); }
        #composer-mcp-toggle {
            align-self: flex-start;
            background: rgba(255,159,10,0.10);
            border: 1px solid rgba(255,159,10,0.30);
            border-radius: 6px;
            color: #ff9f0a;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
        }
        #composer-mcp-toggle:hover { background: rgba(255,159,10,0.20); }
        #composer-mcp {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        #composer-mcp.open { display: flex; }
        #composer-cancel {
            position: absolute;
            top: 10px; right: 10px;
            width: 26px; height: 26px;
            border: none;
            background: transparent;
            border-radius: 7px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }
        #composer-cancel:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

        #detail-panel {
            position: fixed;
            right: 0;
            top: var(--content-top);
            height: calc(100% - var(--content-top));
            width: 420px;
            background: #16181f;
            border-left: 1px solid rgba(52,199,89,0.15);
            border-radius: 16px 0 0 16px;
            box-shadow: -12px 0 40px rgba(0,0,0,0.55);
            z-index: 400;
            transform: translateX(100%);
            transition: transform 0.30s cubic-bezier(0.4,0,0.2,1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #detail-panel.open { transform: translateX(0); }
        #detail-panel-inner {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .detail-panel-header {
            background: var(--bg-card);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
        }
        .detail-panel-accent {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--accent-green);
        }
        .detail-panel-title { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; padding-left: 6px; }
        .detail-panel-name {
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 13px;
            color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .detail-panel-meta { font-family: "SF Mono", ui-monospace, monospace; font-size: 11px; color: var(--text-muted); }
        .active-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .active-toggle {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }
        .active-toggle input { accent-color: var(--accent-green); width: 14px; height: 14px; cursor: pointer; }
        .active-note {
            font-size: 10px;
            color: var(--text-faint);
            line-height: 1.45;
        }
        .detail-panel-close {
            width: 32px; height: 32px;
            border: none; background: transparent;
            border-radius: 8px; cursor: pointer;
            color: var(--text-muted); font-size: 16px;
            flex-shrink: 0;
        }
        .detail-panel-close:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

        .detail-panel-body {
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        .detail-panel-body::-webkit-scrollbar { width: 4px; }
        .detail-panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 2px; }

        .detail-section-label {
            font-size: 9px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .detail-section-label.runs { color: var(--accent-blue); text-transform: none; }
        .run-log { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .run-log:last-child { margin-bottom: 0; }
        .run-log-meta {
            font-family: "SF Mono", ui-monospace, monospace;
            font-size: 10px;
            color: var(--text-muted);
        }
        .detail-section-label.prompt { color: var(--accent-blue); }
        .detail-section-label.result { color: var(--accent-green); }
        .detail-section-label.result.error { color: var(--accent-red); }
        .detail-section-label.summary { color: var(--accent-green); }
        .summary-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .summary-head .detail-section-label { margin-bottom: 0; }
        .summary-regen {
            background: rgba(52,199,89,0.14);
            border: 1px solid rgba(52,199,89,0.40);
            border-radius: 8px;
            color: #34c759;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            padding: 4px 12px;
            cursor: pointer;
        }
        .summary-regen:hover { background: rgba(52,199,89,0.22); }
        .summary-regen:disabled { opacity: 0.55; cursor: default; }
        #prompt-section textarea, #summary-section textarea {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
            line-height: 1.5;
            padding: 8px 10px;
            resize: vertical;
            min-height: 80px;
        }
        #prompt-section textarea:focus, #summary-section textarea:focus { outline: none; border-color: rgba(52,199,89,0.5); }
        .summary-actions { display: flex; align-items: center; gap: 6px; }
        .summary-edit-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            padding: 4px 12px;
            cursor: pointer;
        }
        .summary-edit-btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.25); }
        .regen-submit {
            margin-top: 8px;
            background: rgba(52,199,89,0.14);
            border: 1px solid rgba(52,199,89,0.40);
            border-radius: 8px;
            color: #34c759;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            padding: 5px 14px;
            cursor: pointer;
        }
        .regen-submit:hover { background: rgba(52,199,89,0.22); }
        .summary-missing { font-size: 11px; color: var(--text-faint); }

        #error-banner {
            position: fixed;
            top: calc(var(--content-top) + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,69,58,0.12);
            border: 1px solid rgba(255,69,58,0.35);
            border-radius: 10px;
            color: rgba(255,159,150,0.95);
            font-size: 12px;
            padding: 8px 14px;
            z-index: 600;
            display: none;
        }
        #error-banner.show { display: block; }

        @media (max-width: 768px) {
            .gt-subtitle, .gt-version { display: none; }
        }
    </style>
</head>
<body>

    <header id="graph-toolbar">
        <div class="gt-left">
            <div class="lang-switcher" role="group" aria-label="Language selection">
                <button class="lang-btn" data-lang="en" aria-label="Switch to English" aria-pressed="false">🇬🇧</button>
                <button class="lang-btn" data-lang="fr" aria-label="Passer au français" aria-pressed="false">🇫🇷</button>
            </div>
        </div>
        <div class="gt-title-group">
            <span class="gt-title">openloop graph</span>
            <span class="gt-version">version 1.0</span>
        </div>
        <div class="gt-right">
            <span id="refreshCountdown" class="countdown" title="Auto-refresh every 5s"></span>
        </div>
    </header>

    <div id="graph-chain"></div>

    <div id="graph-canvas">
        <div id="graph-grid"></div>
    </div>

    <div id="composer">
        <button id="composer-cancel" title="Cancel">✕</button>
        <textarea id="composer-text" placeholder="Type the prompt…" autocomplete="off" spellcheck="false"></textarea>
        <button id="composer-mcp-toggle" type="button">mcp</button>
        <div id="composer-mcp">
            <div class="mcp-row">
                <input id="composer-mcp-url" type="text" placeholder="https://example.com/mcp" spellcheck="false" autocomplete="off">
            </div>
            <div class="mcp-row">
                <input id="composer-mcp-auth" type="text" placeholder="Authorization header value, e.g. Bearer sk-…" spellcheck="false" autocomplete="off">
            </div>
            <div class="mcp-hint">Remote MCP for the new cell (optional). Config file is generated automatically.</div>
        </div>
        <div id="composer-agents"></div>
        <div id="composer-hint">Pick an agent to run. Runs with the _bottom_ persona.</div>
    </div>

    <div id="detail-panel">
        <div id="detail-panel-inner"></div>
    </div>

    <div id="error-banner"></div>

    <script src="lang.js"></script>
    <script src="graph.js"></script>
    <script>
        initLangSwitcher();
    </script>
</body>
</html>
